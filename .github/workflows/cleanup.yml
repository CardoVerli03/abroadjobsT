name: Cleanup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
        run: |
          curl -X POST "${VERCEL_URL}/api/admin/cleanup" \
            -H "Content-Type: application/json" \
            -H "x-scrape-secret: ${SCRAPE_SECRET}" \
            -d "{\"telegramId\": \"${ADMIN_TELEGRAM_ID}\"}"
