name: Scrape Remotive

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Remotive scraper
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node scrapers/remotive.js
